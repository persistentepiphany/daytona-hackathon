<!doctype html>
<meta charset="utf-8">
<title>Live run feed</title>
<style>
 :root { --bg:#fbfbfa; --ink:#1a1a19; --dim:#6b6b66; --line:#d8d8d2; --card:#fff;
         --ok:#1f7a3d; --bad:#b3261e; --mid:#8a6d1f; --run:#1f5fa8; }
 * { box-sizing: border-box; }
 body { font: 13px/1.45 system-ui, sans-serif; margin:0; background:var(--bg); color:var(--ink); }
 header { border-bottom:1px solid var(--line); padding:.6rem .9rem; background:var(--card);
          position:sticky; top:0; z-index:2; }
 h1 { font-size:.95rem; margin:0 0 .45rem; font-weight:600; }
 h1 small { font-weight:400; color:var(--dim); }
 .strip { display:flex; gap:1.2rem; align-items:center; flex-wrap:wrap; }
 .chip { border:1px solid var(--line); border-radius:99px; padding:.05rem .5rem; font-size:.78rem;
         color:var(--dim); }
 .chip.approved { border-color:var(--ok); color:var(--ok); }
 .chip.blocked { border-color:var(--bad); color:var(--bad); }
 .bars { min-width:19rem; }
 .bar { height:9px; border-radius:5px; margin:.18rem 0; position:relative; }
 .bar.measured { background:#e6e6e0; }
 .bar.measured > i { display:block; height:100%; border-radius:5px; background:var(--run); }
 .bar.ceiling { border:1.5px solid var(--dim); background:transparent; }
 .bar.ceiling > i { display:block; height:100%; border-radius:4px; background:transparent;
                    border-right:1.5px solid var(--dim); }
 .lbl { font-size:.72rem; color:var(--dim); }
 main { display:grid; grid-template-columns: 1fr 1fr; gap:0; height:calc(100vh - 74px); }
 section { overflow-y:auto; padding:.6rem .9rem; }
 #grid { border-left:1px solid var(--line); display:grid; gap:.55rem;
         grid-template-columns:repeat(auto-fill,minmax(19rem,1fr)); align-content:start; }
 .row { border-bottom:1px solid var(--line); padding:.3rem 0; display:flex; gap:.5rem; }
 .row .role { color:var(--dim); min-width:5.4rem; font-size:.76rem; padding-top:.08rem; }
 .row .txt { flex:1; word-break:break-word; font-family:ui-monospace,monospace; font-size:.79rem; }
 .row.obs .txt { white-space:pre-wrap; color:var(--dim); }
 .row.obs.fail .txt { color:var(--bad); }
 .patch { border:1px solid var(--line); border-radius:6px; margin:.4rem 0; background:var(--card); }
 .patch h3 { margin:0; font-size:.78rem; padding:.3rem .5rem; border-bottom:1px solid var(--line);
             font-weight:600; display:flex; gap:.5rem; }
 .patch h3 .plus { color:var(--ok); } .patch h3 .minus { color:var(--bad); }
 .patch h3 .base { color:var(--dim); font-weight:400; margin-left:auto; font-size:.72rem; }
 .patch pre { margin:0; padding:.35rem .5rem; overflow-x:auto; font-size:.74rem; line-height:1.35; }
 .patch pre b { display:block; font-weight:400; }
 .patch pre b.a { background:#e8f6ec; color:#14532d; }
 .patch pre b.d { background:#fdecea; color:#7f1d1d; }
 .patch pre b.h { color:var(--dim); }
 .tile { border:2px solid var(--line); border-radius:7px; background:var(--card); padding:.4rem .5rem; }
 .tile.running { border-color:var(--run); } .tile.done { border-color:var(--ok); }
 .tile.failed { border-color:var(--bad); } .tile.queued { border-color:var(--line); }
 .tile h4 { margin:0 0 .2rem; font-size:.8rem; display:flex; gap:.4rem; align-items:baseline; }
 .tile h4 .state { color:var(--dim); font-weight:400; font-size:.72rem; }
 .tile h4 .verdict { margin-left:auto; font-size:.68rem; border:1px solid currentColor;
                     border-radius:3px; padding:0 .25rem; }
 .tile .log { font-family:ui-monospace,monospace; font-size:.68rem; line-height:1.3;
              white-space:pre-wrap; max-height:9rem; overflow-y:auto; color:var(--dim);
              background:#fafaf7; border-radius:4px; padding:.25rem .35rem; margin-top:.25rem; }
 .empty { color:var(--dim); font-style:italic; }
</style>

<header>
  <h1>Live run feed <small id="runid"></small> <small id="conn"></small></h1>
  <div class="strip">
    <div id="gates" class="strip"></div>
    <div id="budget" class="lbl"></div>
    <div class="bars">
      <div class="bar measured"><i id="b-measured" style="width:0%"></i></div>
      <div class="lbl" id="l-measured">measured: waiting for a completed attempt</div>
      <div class="bar ceiling"><i id="b-ceiling" style="width:100%"></i></div>
      <div class="lbl" id="l-ceiling">ceiling: enforced upper bound (TTLs + budget)</div>
    </div>
  </div>
</header>

<main>
  <section id="feed"><p class="empty">waiting for events…</p></section>
  <section id="grid"></section>
</main>

<script>
const qs = new URLSearchParams(location.search);
const runId = qs.get("run_id") || "";
const feed = document.getElementById("feed"), grid = document.getElementById("grid");
const tiles = new Map(), gates = new Map();
let hoverFeed = false, hoverGrid = false;
feed.onmouseenter = () => hoverFeed = true;  feed.onmouseleave = () => hoverFeed = false;
grid.onmouseenter = () => hoverGrid = true;  grid.onmouseleave = () => hoverGrid = false;
document.getElementById("runid").textContent = runId;

const el = (tag, cls, text) => { const n = document.createElement(tag);
  if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const secs = s => s == null ? "—" : (s < 90 ? `${Math.round(s)}s`
  : s < 5400 ? `${Math.round(s / 60)}m` : `${(s / 3600).toFixed(1)}h`);

function push(node) {
  const first = feed.querySelector(".empty"); if (first) first.remove();
  feed.appendChild(node);
  while (feed.childElementCount > 400) feed.firstElementChild.remove();
  if (!hoverFeed) feed.scrollTop = feed.scrollHeight;
}

function tile(id) {
  let t = tiles.get(id);
  if (t) return t;                                   // tiles are created lazily, on the
  const box = el("div", "tile queued");              // first event that names an attempt
  const head = el("h4"); const name = el("span", null, id.replace(/^att-/, ""));
  const state = el("span", "state", "queued"); const verdict = el("span", "verdict");
  verdict.style.display = "none";
  head.append(name, state, verdict);
  const prog = el("div", "bar measured"); const fill = el("i"); fill.style.width = "0%";
  prog.appendChild(fill);
  const meta = el("div", "lbl", ""); const log = el("div", "log");
  box.append(head, prog, meta, log); grid.appendChild(box);
  t = { box, name, state, verdict, fill, meta, log, lines: [] };
  tiles.set(id, t);
  return t;
}

function logLines(t, text) {
  for (const line of text.split("\n")) if (line !== "") t.lines.push(line);
  if (t.lines.length > 30) t.lines = t.lines.slice(-30);   // 30-line ring buffer
  t.log.textContent = t.lines.join("\n");
  if (!hoverGrid) t.log.scrollTop = t.log.scrollHeight;
}

const reduce = {
  "agent.action": p => { const r = el("div", "row");
    r.append(el("span", "role", p.role || "agent"), el("span", "txt", p.summary || p.type));
    push(r); },

  "agent.patch": p => { const c = el("div", "patch");
    const h = el("h3"); h.append(el("span", null, p.path),
      el("span", "plus", "+" + p.added), el("span", "minus", "−" + p.removed),
      el("span", "base", p.base === "empty" ? "new file (or first write this run)" : "diff vs this run"));
    const pre = el("pre");
    for (const line of (p.hunk || "").split("\n")) {
      const cls = line.startsWith("+") ? "a" : line.startsWith("-") ? "d"
        : line.startsWith("@@") ? "h" : "";
      pre.appendChild(el("b", cls, line));
    }
    c.append(h, pre); push(c); },

  "agent.observation": p => { const r = el("div", "row obs" + (p.exit ? " fail" : ""));
    r.append(el("span", "role", "exit " + p.exit),
             el("span", "txt", (p.tail || "").slice(-600)));
    push(r); },

  "log.chunk": p => { const t = tile(p.attempt_id);
    if (p.suppressed) logLines(t, `[${p.bytes}B withheld — held-out experiment]`);
    else if (p.truncated) logLines(t, "[log truncated at the per-attempt cap]");
    else logLines(t, p.text || ""); },

  "attempt.state": p => { const t = tile(p.attempt_id);
    t.box.className = "tile " + p.state; t.state.textContent = p.state;
    if (p.exp_id) t.name.textContent = p.exp_id;
    const r = el("div", "row");
    r.append(el("span", "role", "attempt"),
             el("span", "txt", `${p.exp_id || p.attempt_id} → ${p.state}`));
    push(r); },

  "attempt.progress": p => { const t = tile(p.attempt_id);
    t.fill.style.width = (100 * p.done / Math.max(1, p.total)) + "%";
    t.meta.textContent = `${p.done}/${p.total} seeds · measured ETA ${secs(p.eta_s)}`; },

  "gate.changed": p => { gates.set(p.gate, p.state); renderGates();
    const r = el("div", "row");
    r.append(el("span", "role", "gate"), el("span", "txt", `${p.gate} ${p.state}`));
    push(r); },

  "verdict.emitted": p => { if (p.attempt_id) { const t = tile(p.attempt_id);
      t.verdict.style.display = ""; t.verdict.textContent = p.verdict;
      t.verdict.style.color = p.verdict.includes("WITHIN") || p.verdict.includes("PASS")
        ? "var(--ok)" : p.verdict.includes("NOT") || p.verdict.includes("FAIL")
        ? "var(--bad)" : "var(--mid)"; }
    const r = el("div", "row");
    r.append(el("span", "role", "verdict"),
      el("span", "txt", `${p.experiment_id || p.claim_id}: ${p.verdict}`
        + (p.held_out ? "  (held-out)" : "")));
    push(r); },

  "budget.tick": p => { document.getElementById("budget").textContent =
      `${p.kind}: ${Math.round(p.spent)}${p.ceiling ? " / " + Math.round(p.ceiling) : ""}`
      + (p.state === "exceeded" ? " — CEILING REACHED" : ""); },

  "run.done": p => { const r = el("div", "row");
    r.append(el("span", "role", "run"), el("span", "txt", "run complete")); push(r);
    document.getElementById("conn").textContent = "· finished"; },
};

function renderGates() {
  const box = document.getElementById("gates"); box.innerHTML = "";
  for (const [g, state] of gates) box.appendChild(el("span", "chip " + state, g));
}

// the timing strip: solid bar = measured, hollow bar = the enforced ceiling. They are
// never the same quantity and are labelled so they cannot be read as one.
function renderEstimate(e) {
  const f = e.fleet || {}, ceil = e.ceiling_s;
  const mB = document.getElementById("b-measured"), mL = document.getElementById("l-measured");
  const cL = document.getElementById("l-ceiling");
  const a = e.attempts || {}, total = (a.done || 0) + (a.running || 0) + (a.pending || 0);
  mB.style.width = total ? (100 * (a.done || 0) / total) + "%" : "0%";
  if (e.round) {
    mL.textContent = `${e.round.label} — no whole-run estimate while a round is pending`;
  } else if (f.basis === "config_default") {
    mL.textContent = `${a.done || 0}/${total} attempts · no measurements yet — ceiling only`;
  } else {
    mL.textContent = `${a.done || 0}/${total} attempts · fleet ${secs(f.low_s)}–${secs(f.high_s)}`
      + ` (queue simulation over a measured median, n=${f.n_samples}, ${f.basis})`;
  }
  cL.textContent = `ceiling ${secs(ceil)} — enforced upper bound (remaining TTLs, capped by budget)`;
}

const src = new EventSource("/events?" + qs.toString());
src.onopen = () => document.getElementById("conn").textContent = "· connected";
src.onerror = () => document.getElementById("conn").textContent = "· reconnecting…";
src.onmessage = ev => { const m = JSON.parse(ev.data);
  const fn = reduce[m.kind]; if (fn) fn(m.payload || {}); };
src.addEventListener("estimate", ev => renderEstimate(JSON.parse(ev.data)));
</script>
