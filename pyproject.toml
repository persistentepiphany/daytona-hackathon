[project]
name = "repro"
version = "0.1.0"
description = "Preregistered paper reproduction pipeline on Daytona"
requires-python = ">=3.11"
dependencies = [
    "daytona==0.207.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "anthropic>=0.40",
    # paper intake: text and figure-region extraction. repro.ingest.pdf falls
    # back to pypdf when this is absent, at the cost of vector diagrams.
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repro = "repro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repro*"]

[tool.setuptools.package-data]
repro = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
