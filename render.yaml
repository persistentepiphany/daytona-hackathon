services:
  - type: web
    name: snapshot-api-staging
    runtime: python
    branch: feat/arxiv-e2e-pipeline
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars: &snapshot-env
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: snapshot-postgres-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: snapshot-queue-staging
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: ARXIV_USER_AGENT
        value: Snapshot-Reproduction/1.0 (+https://github.com/persistentepiphany/daytona-hackathon)
      - key: DAYTONA_API_KEY
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      - key: OBJECT_STORAGE_BACKEND
        value: database
      - key: EPHEMERAL_BLOB_TTL_HOURS
        value: "72"
      - key: MAX_DATABASE_BLOB_BYTES
        value: "52428800"
      - key: GITHUB_OWNER
        value: persistentepiphany
      - key: GITHUB_USER_TOKEN
        sync: false

  - type: worker
    name: snapshot-worker-staging
    runtime: python
    branch: feat/arxiv-e2e-pipeline
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m repro.service.worker
    autoDeploy: true
    envVars: *snapshot-env

  - type: keyvalue
    name: snapshot-queue-staging
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: snapshot-postgres-staging
    plan: basic-256mb
    databaseName: snapshot
    user: snapshot
    ipAllowList: []
